[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aios"
version = "0.0.0"
description = "Мультиагентная система управления фондом скважин — трек 2 AIOS"
requires-python = ">=3.11"
dependencies = [
    # economics/normatives_io.py читает docs/models/CHDD_PYTHON/input/Нормативы_ЧДД.xlsx —
    # источник истины по нормативам. При отсутствии openpyxl загрузчик падает
    # на разбор xlsx как zip+XML силами stdlib, значения те же.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# Явный список всех Python-пакетов репозитория. Новый подпакет нужно добавлять
# сюда, иначе он не попадёт ни в установку, ни в образ.
[tool.setuptools]
packages = [
    "aios_cli",
    "bridge",
    "config",
    "connectivity",
    "contracts",
    "economics",
    "llm",
    "optimizer",
    "policy",
    "policy.rules",
    "robustness",
    "schedule",
    "surrogate",
    "ui",
]

[tool.pytest.ini_options]
testpaths = [
    "bridge/tests",
    "config/tests",
    "connectivity/tests",
    "contracts/tests",
    "economics/tests",
    "llm/tests",
    "optimizer/tests",
    "policy/tests",
    "robustness/tests",
    "schedule/tests",
    "surrogate/tests",
    "ui/tests",
]
