[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aios"
version = "0.0.0"
description = "Мультиагентная система управления фондом скважин — трек 2 AIOS"
requires-python = ">=3.11"
dependencies = [
    # economics/normatives_io.py читает docs/models/CHDD_PYTHON/input/Нормативы_ЧДД.xlsx —
    # источник истины по нормативам. При отсутствии openpyxl загрузчик падает
    # на разбор xlsx как zip+XML силами stdlib, значения те же.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# Пакеты добавляются сюда по мере появления: schedule, economics, bridge,
# surrogate, optimizer, connectivity, policy, robustness, ui, llm, config.
# Сейчас реально существует только contracts/ — общие типы.
[tool.setuptools]
packages = ["aios_cli", "contracts", "economics", "schedule"]

[tool.pytest.ini_options]
testpaths = ["contracts/tests", "economics/tests", "schedule/tests"]
