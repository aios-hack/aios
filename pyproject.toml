[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aios"
version = "0.0.0"
description = "Мультиагентная система управления фондом скважин — трек 2 AIOS"
requires-python = ">=3.11"
dependencies = [
    # economics/normatives_io.py читает docs/models/CHDD_PYTHON/input/Нормативы_ЧДД.xlsx —
    # источник истины по нормативам. При отсутствии openpyxl загрузчик падает
    # на разбор xlsx как zip+XML силами stdlib, значения те же.
    "openpyxl>=3.1",
]

[project.scripts]
aios = "backend.interfaces.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
ml = [
    "numpy>=2.0",
    "torch>=2.6",
]
jarvis = ["edge-tts>=7"]

# Явный список всех Python-пакетов полного интегрированного репозитория.
# Новые подпакеты нужно добавлять сюда, иначе они не попадут в установку и образ.
[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "backend*",
]
exclude = ["*.tests", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = [
    "slow: тяжёлые тесты — настоящий OPM/Flow в Docker, многомегабайтные бандлы витрины, длинные разборы деков",
    "opm: требует настоящего OPM Flow в контейнере",
    "showcase: читает многомегабайтные бандлы витрины из frontend/public/data",
]
testpaths = [
    "tests/backend",
    "tests/architecture",
]
