# Тонкие именованные обёртки над одним и тем же ENTRYPOINT.
# Точка входа — docker/entrypoint.sh, свободный CMD выбирает команду.
# Данные организаторов монтируются снаружи и в образ не входят.

services:
  tests:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    image: aios:latest
    command: ["tests", "-q"]
    volumes:
      - ${AIOS_DOCS:-./../docs}:/data/docs:ro
      - ./out:/out

  npv:
    profiles: ["tools"]
    image: aios:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npv"]
    volumes:
      - ${AIOS_DOCS:-./../docs}:/data/docs:ro
      - ./out:/out

  emit:
    profiles: ["tools"]
    image: aios:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["emit"]
    volumes:
      - ${AIOS_DOCS:-./../docs}:/data/docs:ro
      - ./out:/out

  selfcheck:
    profiles: ["tools"]
    image: aios:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["selfcheck"]
    volumes:
      - ${AIOS_DOCS:-./../docs}:/data/docs:ro

  webdata:
    image: aios:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["webdata"]
    volumes:
      - ${AIOS_DOCS:-./../docs}:/data/docs:ro
      - ./data:/app/data:ro
      - ${AIOS_UI_DATA:-./frontend/public/data}:/app/frontend/public/data

  web:
    image: aios:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["web"]
    depends_on:
      webdata:
        condition: service_completed_successfully
      jarvis:
        condition: service_started
    environment:
      AIOS_JARVIS_UPSTREAM: ${AIOS_JARVIS_UPSTREAM:-http://jarvis:8010}
    ports:
      - "${AIOS_PORT:-8000}:8000"
    volumes:
      - ${AIOS_DOCS:-./../docs}:/data/docs:ro
      - ./out:/out
      # JSON-витрина генерируется локально и не входит в image. Подключаем её
      # прямо к каталогу статики, откуда frontend запрашивает /data/*.json.
      - ${AIOS_UI_DATA:-./frontend/public/data}:/app/frontend/dist/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/data/scenarios.json', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  jarvis:
    image: aios:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["jarvis"]
    depends_on:
      webdata:
        condition: service_completed_successfully
    environment:
      JARVIS_PROVIDER: ${JARVIS_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JARVIS_MODEL: ${JARVIS_MODEL:-anthropic/claude-sonnet-4.5}
      JARVIS_MAX_TOKENS: ${JARVIS_MAX_TOKENS:-1200}
      AIOS_UI_DATA: /app/frontend/dist/data
      AIOS_JARVIS_KNOWLEDGE: /app/frontend/public/jarvis/knowledge
    ports:
      - "${AIOS_JARVIS_PORT:-8010}:8010"
    volumes:
      - ${AIOS_UI_DATA:-./frontend/public/data}:/app/frontend/dist/data:ro
